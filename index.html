<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tom and Jerry Run - Fixed Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0c10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 12px 35px rgba(0,0,0,0.95);
            border-radius: 14px;
            overflow: hidden;
            border: 3px solid #333;
        }
        #gameCanvas {
            display: block;
            background: #87CEEB;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            background: rgba(15, 15, 20, 0.85);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 5;
        }
        .active-powerup {
            position: absolute;
            top: 52px;
            left: 10px;
            background: rgba(255, 215, 0, 0.95);
            color: #000;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 22px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #startOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            cursor: pointer;
        }
        .start-card {
            background: #1f2833;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
        }
        .start-card h2 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .click-to-start {
            background: #4e54c8;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #restartBtn {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            display: none;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <div>Stage: <span id="levelName" style="color: #ffca28;">Kitchen</span></div>
            <div>Score: <span id="score">0</span> (High: <span id="highScore">0</span>)</div>
            <div>Coins: <span id="coins" style="color: #ffd700;">🪙 0</span></div>
            <div>Target: <span id="distance">200</span>m</div>
        </div>
        
        <div id="powerupStatus" class="active-powerup">⚡ SPEED BOOST</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="startOverlay">
            <div class="start-card">
                <h2>Tom and Jerry Run!</h2>
                <p style="color: #ccc; margin-bottom: 10px;">Select Character:</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
                    <button id="selectTom" style="background: #008cba;">🐱 TOM</button>
                    <button id="selectSpike" style="background: #e63946;">🐕 SPIKE</button>
                </div>
                <div class="click-to-start">👉 TAP / CLICK ANYWHERE TO START 👈</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="jumpBtn">JUMP 🦘</button>
        <button id="slideBtn">SLIDE 📉</button>
        <button id="restartBtn">PLAY AGAIN 🔄</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const characters = {
            tom: { src: 'tom.png', name: 'TOM 🐱' },
            spike: { src: 'randwa.png', name: 'RANDWA 🐕' }
        };
        let selectedChar = 'tom';

        const chaserImg = new Image();
        chaserImg.crossOrigin = "Anonymous";
        chaserImg.src = characters.tom.src;
        
        const jerryImg = new Image();
        jerryImg.crossOrigin = "Anonymous";
        jerryImg.src = 'https://upload.wikimedia.org/wikipedia/en/2/2f/Jerry_Mouse.png';

        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const coinsEl = document.getElementById('coins');
        const distEl = document.getElementById('distance');
        const levelEl = document.getElementById('levelName');
        const powerupStatus = document.getElementById('powerupStatus');
        const restartBtn = document.getElementById('restartBtn');
        const startOverlay = document.getElementById('startOverlay');

        // Custom Local MP3 Audio
        const bgm = new Audio('chodu.mp3');
        bgm.loop = true;
        bgm.volume = 0.5;

        function startBGM() {
            bgm.currentTime = 0;
            bgm.play().catch(e => console.log("Audio play error:", e));
        }

        function stopBGM() {
            bgm.pause();
        }

        const levels = [
            { name: "House Kitchen", bg: "#4a3c31", ground: "#8d6e63", req: 150 },
            { name: "Backyard Garden", bg: "#87ceeb", ground: "#2e8b57", req: 100 },
            { name: "City Streets", bg: "#34495e", ground: "#555555", req: 50 },
            { name: "Night Roofs", bg: "#1a1a2e", ground: "#16213e", req: 0 }
        ];
        let currentLevelIndex = 0;

        let baseSpeed = 6;
        let gameSpeed = baseSpeed;
        let score = 0;
        let highScore = localStorage.getItem('tj_highscore') || 0;
        highScoreEl.innerText = highScore;

        let coins = 0;
        let distanceToJerry = 200;
        let gameOver = false;
        let gameWin = false;
        let gameStarted = false;
        let frameCount = 0;
        let bgOffset = 0;

        let activePowerup = null;
        let powerupTimer = 0;

        const player = {
            x: 80, y: 260, width: 75, height: 80,
            originalHeight: 80, velocityY: 0, gravity: 0.8,
            jumping: false, jumpCount: 0, sliding: false, slideTimer: 0, jumpForce: -14
        };

        const jerry = { y: 280, width: 50, height: 60 };
        let obstacles = [];
        let items = [];
        let particles = [];

        document.getElementById('selectTom').onclick = (e) => { 
            e.stopPropagation();
            selectedChar = 'tom'; 
            chaserImg.src = characters.tom.src;
        };
        document.getElementById('selectSpike').onclick = (e) => { 
            e.stopPropagation();
            selectedChar = 'spike'; 
            chaserImg.src = characters.spike.src;
        };

        function launchGame() {
            if (gameStarted) return;
            gameStarted = true;
            startOverlay.style.display = 'none';
            startBGM();
        }

        startOverlay.addEventListener('click', launchGame);
        startOverlay.addEventListener('touchstart', launchGame);

        window.addEventListener('keydown', (e) => {
            if (!gameStarted) launchGame();
            if ((e.code === 'Space' || e.code === 'ArrowUp')) jump();
            if (e.code === 'ArrowDown') slide();
        });

        document.getElementById('jumpBtn').onclick = jump;
        document.getElementById('slideBtn').onclick = slide;
        restartBtn.onclick = resetGame;

        function jump() {
            if (gameStarted && !gameOver) {
                if (!player.jumping || player.jumpCount < 2) {
                    const force = activePowerup === 'superjump' ? -19 : player.jumpForce;
                    player.velocityY = force;
                    player.jumping = true;
                    player.jumpCount++;
                    addParticles(player.x + 30, player.y + 70, '#ffffff', 5);
                }
            }
        }

        function slide() {
            if (!player.sliding && !player.jumping && gameStarted && !gameOver) {
                player.sliding = true;
                player.height = player.originalHeight / 2;
                player.y += player.originalHeight / 2;
                player.slideTimer = 35;
            }
        }

        function addParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 4 + 2,
                    color, life: 20
                });
            }
        }

        function spawnObstacle() {
            const types = ['📦', '🛢️', '🪵', '🧱'];
            const label = types[Math.floor(Math.random() * types.length)];
            obstacles.push({ x: canvas.width, y: 280, width: 45, height: 50, label });
        }

        function spawnItem() {
            const rand = Math.random();
            let itemType = 'coin';
            if (rand > 0.85) itemType = 'speed';
            else if (rand > 0.72) itemType = 'magnet';
            else if (rand > 0.58) itemType = 'milk';
            else if (rand > 0.45) itemType = 'superjump';

            items.push({ x: canvas.width, y: 180 + Math.random() * 80, width: 25, height: 25, type: itemType });
        }

        function update() {
            if (!gameStarted || gameOver || gameWin) return;

            frameCount++;
            baseSpeed = 6 + (score / 200);
            gameSpeed = (activePowerup === 'speed') ? baseSpeed * 1.6 : baseSpeed;
            bgOffset = (bgOffset + gameSpeed) % 40;

            if (activePowerup) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    activePowerup = null;
                    powerupStatus.style.display = 'none';
                }
            }

            player.velocityY += player.gravity;
            player.y += player.velocityY;

            if (player.y >= 260) {
                player.y = 260;
                player.velocityY = 0;
                player.jumping = false;
                player.jumpCount = 0;
            }

            if (player.sliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.sliding = false;
                    player.y -= player.originalHeight / 2;
                    player.height = player.originalHeight;
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            if (frameCount % Math.max(45, 90 - Math.floor(score/50)) === 0) spawnObstacle();
            if (frameCount % 75 === 0) spawnItem();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    if (activePowerup === 'milk' || activePowerup === 'speed') {
                        addParticles(obstacles[i].x, obstacles[i].y, '#ffca28', 10);
                        obstacles.splice(i, 1);
                    } else {
                        gameOver = true;
                        stopBGM();
                        if (score > highScore) {
                            highScore = Math.floor(score);
                            localStorage.setItem('tj_highscore', highScore);
                        }
                        restartBtn.style.display = 'inline-block';
                    }
                }
                if (obstacles[i] && obstacles[i].x < -50) obstacles.splice(i, 1);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                if (activePowerup === 'magnet' && items[i].type === 'coin') {
                    const dx = player.x - items[i].x;
                    const dy = player.y - items[i].y;
                    items[i].x += dx * 0.15;
                    items[i].y += dy * 0.15;
                } else {
                    items[i].x -= gameSpeed;
                }

                if (
                    player.x < items[i].x + items[i].width &&
                    player.x + player.width > items[i].x &&
                    player.y < items[i].y + items[i].height &&
                    player.y + player.height > items[i].y
                ) {
                    addParticles(items[i].x, items[i].y, '#ffd700', 8);
                    if (items[i].type === 'coin') {
                        coins++; score += 25;
                    } else {
                        activePowerup = items[i].type;
                        powerupTimer = 300;
                        powerupStatus.style.display = 'block';
                        powerupStatus.innerText = items[i].type.toUpperCase() + ' POWER!';
                    }
                    items.splice(i, 1);
                } else if (items[i].x < -50) items.splice(i, 1);
            }

            if (distanceToJerry > 0) {
                distanceToJerry -= 0.04;
                if (distanceToJerry <= levels[currentLevelIndex].req && currentLevelIndex < levels.length - 1) {
                    currentLevelIndex++;
                }
                if (distanceToJerry <= 0) {
                    distanceToJerry = 0;
                    gameWin = true;
                    stopBGM();
                    restartBtn.style.display = 'inline-block';
                }
            }

            score += 0.1;
            scoreEl.innerText = Math.floor(score);
            highScoreEl.innerText = highScore;
            coinsEl.innerText = `🪙 ${coins}`;
            distEl.innerText = Math.floor(distanceToJerry);
            levelEl.innerText = levels[currentLevelIndex].name;
        }

        function draw() {
            const currentLvl = levels[currentLevelIndex];
            
            // Sky Background
            ctx.fillStyle = currentLvl.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground Background
            ctx.fillStyle = currentLvl.ground;
            ctx.fillRect(0, 340, canvas.width, 60);

            // Moving Ground Lines
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            for (let x = -bgOffset; x < canvas.width; x += 40) {
                ctx.fillRect(x, 340, 20, 60);
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Player Chaser
            if (chaserImg.complete && chaserImg.naturalWidth !== 0) {
                ctx.drawImage(chaserImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#708090';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.fillText(characters[selectedChar].name, player.x, player.y - 8);

            // Jerry Target
            const jerryX = 550 + (distanceToJerry * 1.1);
            if (jerryImg.complete && jerryImg.naturalWidth !== 0) {
                ctx.drawImage(jerryImg, jerryX, jerry.y, jerry.width, jerry.height);
            } else {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(jerryX, jerry.y, jerry.width, jerry.height);
            }
            ctx.fillStyle = '#fff';
            ctx.fillText('JERRY 🐭', jerryX, jerry.y - 8);

            // Obstacles
            obstacles.forEach(obs => {
                ctx.font = '32px Arial';
                ctx.fillText(obs.label, obs.x, obs.y + 35);
            });

            // Items
            items.forEach(item => {
                ctx.font = '22px Arial';
                if (item.type === 'coin') ctx.fillText('🪙', item.x, item.y + 20);
                else if (item.type === 'speed') ctx.fillText('⚡', item.x, item.y + 20);
                else if (item.type === 'magnet') ctx.fillText('🧲', item.x, item.y + 20);
                else if (item.type === 'milk') ctx.fillText('🥛', item.x, item.y + 20);
                else if (item.type === 'superjump') ctx.fillText('🦘', item.x, item.y + 20);
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FF4444';
                ctx.font = 'bold 32px Arial';
                ctx.fillText('GAME OVER!', 300, 180);
                ctx.fillStyle = '#FFF';
                ctx.font = '18px Arial';
                ctx.fillText(`Score: ${Math.floor(score)} | Coins: ${coins}`, 290, 220);
            }

            if (gameWin) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00FF66';
                ctx.font = 'bold 34px Arial';
                ctx.fillText('VICTORY! CAUGHT JERRY! 🎉', 180, 180);
            }
        }

        function resetGame() {
            score = 0; coins = 0; distanceToJerry = 200;
            gameOver = false; gameWin = false; frameCount = 0;
            currentLevelIndex = 0; obstacles = []; items = []; particles = [];
            activePowerup = null;
            powerupStatus.style.display = 'none';
            restartBtn.style.display = 'none';
            player.y = 260; player.jumping = false; player.sliding = false;
            startBGM();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
